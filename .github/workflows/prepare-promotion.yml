name: Prepare Release Promotion

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Distribution channel to update"
        required: true
        type: choice
        options:
          - qa
          - stable
      release:
        description: "Release ID to promote (e.g. 2026.09.1)"
        required: true
        type: string
      sequence:
        description: "Optional explicit monotonic sequence number (auto-increments if omitted)"
        required: false
        type: string
      notes:
        description: "Promotion notes / rationale"
        required: false
        type: string

permissions: {}

concurrency:
  # ponytail: one global promotion lock; split by channel only if throughput matters
  group: model-release-promotion
  cancel-in-progress: false

jobs:
  prepare-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Promote channel
        env:
          MODEL_RELEASE_SIGNING_KEY: ${{ secrets.MODEL_RELEASE_SIGNING_KEY }}
          PROMOTION_CHANNEL: ${{ inputs.channel }}
          PROMOTION_RELEASE: ${{ inputs.release }}
          PROMOTION_SEQUENCE: ${{ inputs.sequence }}
          PROMOTION_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [[ -z "${MODEL_RELEASE_SIGNING_KEY:-}" ]]; then
            echo "::error::MODEL_RELEASE_SIGNING_KEY secret is not configured in GitHub Secrets. Promotions must be cryptographically signed."
            exit 1
          fi
          args=(
            promote
            --channel "$PROMOTION_CHANNEL"
            --release "$PROMOTION_RELEASE"
          )
          if [[ -n "$PROMOTION_SEQUENCE" ]]; then
            args+=(--sequence "$PROMOTION_SEQUENCE")
          fi
          if [[ -n "$PROMOTION_NOTES" ]]; then
            args+=(--notes "$PROMOTION_NOTES")
          fi
          scribekey-models "${args[@]}"

      - name: Generate and validate outputs
        run: |
          scribekey-models generate --check
          scribekey-models validate
          pytest -q

      - name: Create Promotion Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ github.token }}
          branch: promote/${{ inputs.channel }}-${{ inputs.release }}
          title: "chore(release): promote ${{ inputs.channel }} to ${{ inputs.release }}"
          commit-message: "chore(release): promote ${{ inputs.channel }} to ${{ inputs.release }}"
          body: |
            ### ScribeKey Channel Promotion Request

            - **Channel**: `${{ inputs.channel }}`
            - **Target Release**: `${{ inputs.release }}`
            - **Notes**: ${{ inputs.notes }}

            This automated pull request was prepared by the `prepare-promotion` workflow.
            All catalogue guardrails, schema validations, and reproducibility checks have passed.

            > **Atomic Publication Boundary**: Human review and merge are required.
            > Merging this pull request into `main` publishes the release-safe distribution metadata to consumers.
            > Auto-merge is disabled.
          labels: |
            release
            distribution
